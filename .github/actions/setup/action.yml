name: Set up
description: Node from .nvmrc, npm ci from the cache, and optionally Playwright's Chromium.

inputs:
  playwright:
    description: Also install Playwright's Chromium and its system libraries.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash

    # The browser download is cached per Playwright version; the system
    # libraries it needs come from apt and are installed every time, which is
    # quick on a fresh runner.
    - if: inputs.playwright == 'true'
      id: pw
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.playwright == 'true'
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
      shell: bash
