name: Feature request
description: Suggest a small improvement to something that exists. For a new component, token or pattern, use Proposal.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you building, and what does the system not cover today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The states it needs, and how it fits the system's rules (keylines, zero radius, state never colour alone).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
