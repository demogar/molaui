name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the run for the previous push moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent jobs, run side by side. Each browser shard builds its own
# Storybook (about ten seconds) rather than waiting on Gates for an artifact,
# so the slowest job sets the wall-clock time, not the sum of them. The target
# is three to four minutes for the whole run.
jobs:
  gates:
    # The ruleset requires this name: rename it there too.
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # npm audit on what ships; retries, and warns rather than fails when the
      # registry is unreachable (scripts/deps.mjs says why).
      - run: npm run deps:audit
      - run: npm run tokens:check
      - run: npm run manifest:check
      - run: npm run evidence:check
      - run: npm run build
      - run: npm run api:check
      - run: npm run size
      - run: npm run build-storybook -- --quiet
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: storybook-static

  # The two browser jobs each took seven to nine minutes on one runner, so
  # each is split across four. The ruleset requires the names "Browser audit"
  # and "Visual regression"; a small job with each name passes only when every
  # shard did, so the shard count can change without touching the ruleset.
  audit-shard:
    name: Browser audit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: npm run build-storybook -- --quiet
      - run: npm run audit -- --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-audit-${{ matrix.shard }}
          path: reports/audit
          if-no-files-found: ignore

  audit:
    # The ruleset requires this name: rename it there too.
    name: Browser audit
    needs: audit-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.audit-shard.result }}" = success

  visual-shard:
    name: Visual regression (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: npm run build-storybook -- --quiet
      # Dealt round-robin by test/visual/shard.ts, not Playwright's --shard,
      # which cut the list into contiguous runs of uneven cost.
      - run: npm run visual
        env:
          VISUAL_SHARD: ${{ matrix.shard }}/4
      # The report holds expected, actual and diff for every failure. To
      # accept an intended change, see "Visual baselines" in CONTRIBUTING.md.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results/visual
          if-no-files-found: ignore
      # Per-test durations, for checking the split against real costs (the
      # audit writes its own into audit.json).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-timings-${{ matrix.shard }}
          path: reports/visual
          retention-days: 7
          if-no-files-found: ignore

  visual:
    # The ruleset requires this name: rename it there too.
    name: Visual regression
    needs: visual-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.visual-shard.result }}" = success

  consumers:
    name: Consumer smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # The fixtures install their own dependencies from the registry; their
      # downloads share npm's cache with everything else.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: consumers-${{ runner.os }}-${{ hashFiles('test/consumers/*/package.json') }}
          restore-keys: consumers-${{ runner.os }}-
      - run: npm run build
      - run: npm run consumers

  # The three-to-four-minute target, checked rather than remembered: fails
  # when the first job's start to the last job's end is over four minutes,
  # and writes every job's time and the spread between shards to the run
  # summary. Not a required check (a slow GitHub day should not block a
  # merge), but a red one on the pull request that made CI slower.
  budget:
    name: CI budget
    needs: [gates, audit, visual, consumers]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      # The runner's own Node is enough for one fetch; no setup, no modules.
      - run: node scripts/ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Publish Storybook
    needs: [gates, audit, visual, consumers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
