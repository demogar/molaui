name: PR title

# main is squash-merged and the PR title becomes the commit message, which is
# what release-please reads to decide the next version and write the changelog.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Lowercase subjects, except Dependabot's "Bump ...": it always
          # capitalises and has no setting to change that.
          subjectPattern: ^(?:Bump |(?![A-Z])).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
      # The scope must be declared in src/docs/usage/changes.ts. That file's
      # test only sees a scope once release-please writes it into the release
      # PR, so an undeclared one used to fail the release instead of the PR
      # that introduced it (#141, #143). A title with no scope passes.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            src/docs/usage
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The title goes through the environment, never into the script text,
      # so a title cannot inject shell.
      - run: node scripts/pr-scope.mjs "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
