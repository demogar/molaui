name: Update visual baselines

# Visual baselines must be rendered on Linux, by the same runner image and
# Playwright build the Visual regression job uses; a laptop's font
# rasteriser differs by more than the threshold. This workflow renders them
# and commits them to the branch. Two ways to start it:
#
#   - add the `update-visual-baselines` label to a pull request, or
#   - gh workflow run "Update visual baselines" --ref <branch>
#     (once this file is on main; GitHub only lists dispatchable workflows
#     from the default branch).
#
# Only baselines whose pixels changed beyond the threshold are rewritten, so
# an unrelated change does not churn every PNG.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baselines-${{ github.head_ref || github.ref_name }}

jobs:
  update:
    name: Render baselines on Linux
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-visual-baselines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          # A push made with the default token does not start CI. With
          # RELEASE_PLEASE_TOKEN (a PAT or app token) set, the commit below is
          # checked like any other; without it, push once more to run CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: npm run build-storybook -- --quiet
      - run: npm run visual:update
      - name: Commit changed baselines
        run: |
          git add test/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): update baselines rendered on linux"
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: test/visual/__screenshots__/linux
      - name: Remove the label
        if: github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label update-visual-baselines
        env:
          GH_TOKEN: ${{ github.token }}
