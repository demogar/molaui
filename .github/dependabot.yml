version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Exact pins (devDependencies, and Base UI's pin there) are bumped as before;
    # the ranges an app sees (dependencies, peerDependencies) keep their floor
    # while a new version still satisfies them, so only the lockfile moves and
    # apps are not forced onto the newest release by a weekly bump.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      storybook:
        patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
    ignore:
      # vite-plugin-dts does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint and @eslint/js move together; @eslint/js 10 requires eslint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # @types/node follows the oldest Node we support (engines: 22; .nvmrc runs 24), so code
      # cannot type-check against an API that is missing at runtime on 22.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
