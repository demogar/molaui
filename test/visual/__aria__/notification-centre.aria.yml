      - paragraph: "Unread. Warning: Refund agent is waiting for approval"
      - text: /Order CY-\d+ · \$\d+\.\d+ over the auto-approve limit/
      - time: /\d+ min ago/
      - button "Review"
    - listitem:
      - paragraph: "Success: Evaluation passed for Returns triage v4"
      - text: /\d+ of \d+ prompts matched the reference answer/
      - time: 1 h ago
    - listitem:
      - paragraph: Ana Pérez shared the Escalations view with you
      - time: /Yesterday \d+:\d+/
  - link "View all notifications":
    - /url: "#notifications"