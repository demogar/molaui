    - paragraph:
      - text: /Yes — with one caveat worth checking before you roll out\. The help panel cut support tickets from new workspaces from \d+\.\d+ to \d+\.\d+ per \d+,\d+ across \d+,\d+ new workspaces, and the interval excludes zero/
      - 'link /Source 1: ro-\d+ results — in-app help panel/':
        - /url: "#source-1"
        - text: ""
      - text: .
    - paragraph:
      - text: The drop is concentrated in workspaces on the Starter plan. For Enterprise workspaces, the difference is inside the noise
      - 'link "Source 2: Segment breakdown: Starter vs Enterprise plan"':
        - /url: "#source-2"
        - text: ""
      - text: .
