      - listitem: "/Tickets per \\d+,\\d+ new workspaces: −4\\.2 \\(\\d+% CI −5\\.3 to −3\\.1\\)/"
      - listitem: "/Help articles read in the first week: \\d+\\.\\d+ vs 6\\.1/"
      - listitem:
        - text: "Time to first reply:"
        - strong: slower
        - text: /by about \d+ seconds with the panel/
